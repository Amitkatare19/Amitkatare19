</g>
<text class="line" style="animation-delay:0.60s" x="748" y="120" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="15"><tspan fill="#2CB67D">$</tspan><tspan fill="#E2E8F0" dx="10">whoami</tspan></text><text class="line" style="animation-delay:1.15s" x="748" y="150" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="15"><tspan fill="#A78BFA">→</tspan><tspan fill="#94A3B8" dx="10">SDE @ eSampark Tech Solutions</tspan></text><text class="line" style="animation-delay:1.70s" x="748" y="180" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="15"><tspan fill="#2CB67D">$</tspan><tspan fill="#E2E8F0" dx="10">ls ~/work</tspan></text><text class="line" style="animation-delay:2.25s" x="748" y="210" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="15"><tspan fill="#A78BFA">→</tspan><tspan fill="#94A3B8" dx="10">medh/   esampark/</tspan></text><text class="line" style="animation-delay:2.80s" x="748" y="240" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="15"><tspan fill="#2CB67D">$</tspan><tspan fill="#E2E8F0" dx="10">git log --author=amit | wc -l</tspan></text><text class="line" style="animation-delay:3.35s" x="748" y="270" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="15"><tspan fill="#A78BFA">→</tspan><tspan fill="#94A3B8" dx="10">1000+ commits 🚀</tspan></text><text class="line" style="animation-delay:3.90s" x="748" y="300" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="15"><tspan fill="#2CB67D">$</tspan><tspan fill="#E2E8F0" dx="10">echo $MOTTO</tspan></text><text class="line" style="animation-delay:4.45s" x="748" y="330" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="15"><tspan fill="#A78BFA">→</tspan><tspan fill="#94A3B8" dx="10">Code it. Ship it. Make it move.</tspan></text><text class="line" style="animation-delay:5.00s" x="748" y="360" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="15"><tspan fill="#2CB67D">$</tspan><tspan class="cursor" fill="#E2E8F0" dx="10">▋</tspan></text>
</svg>
