<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Amit Katare — Software Development Engineer at eSampark Tech Solutions, Gurugram">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0E1A"/><stop offset="1" stop-color="#111827"/></linearGradient>
  <linearGradient id="brand" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="reflect">
    <stop offset="0" stop-color="#A78BFA"/><stop offset="0.5" stop-color="#2CB67D"/><stop offset="1" stop-color="#38BDF8"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="0 0;600 0;0 0" dur="8s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7F5AF0" stop-opacity="0.8"/><stop offset="0.5" stop-color="#2CB67D" stop-opacity="0.25"/><stop offset="1" stop-color="#0EA5E9" stop-opacity="0.8"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.045"/></pattern>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
  <clipPath id="clip"><rect width="1200" height="440" rx="28"/></clipPath>
</defs>
<style>
  .orb1{animation:o1 12s ease-in-out infinite}
  .orb2{animation:o2 14s ease-in-out infinite}
  .orb3{animation:o1 16s ease-in-out infinite reverse}
  @keyframes o1{0%,100%{transform:translate(0,0)}50%{transform:translate(90px,40px)}}
  @keyframes o2{0%,100%{transform:translate(0,0)}50%{transform:translate(-80px,-30px)}}
  .fade{animation:fade .8s ease-out both}
  @keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  .line{animation:type 16s linear infinite both}
  @keyframes type{0%{opacity:0}3%{opacity:1}88%{opacity:1}92%{opacity:0}100%{opacity:0}}
  .cursor{animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .pulse{animation:pulse 2s ease-in-out infinite;transform-origin:84px 75px}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
</style>
<g clip-path="url(#clip)">
  <rect width="1200" height="440" fill="url(#bg)"/>
  <rect width="1200" height="440" fill="url(#grid)"/>
  <circle class="orb1" cx="180" cy="60" r="160" fill="#7F5AF0" opacity="0.35" filter="url(#blur)"/>
  <circle class="orb2" cx="1050" cy="400" r="180" fill="#0EA5E9" opacity="0.28" filter="url(#blur)"/>
  <circle class="orb3" cx="640" cy="260" r="120" fill="#2CB67D" opacity="0.18" filter="url(#blur)"/>
</g>
<rect x="0.75" y="0.75" width="1198.5" height="438.5" rx="28" fill="none" stroke="url(#stroke)" stroke-width="1.5"/>

<g class="fade" style="animation-delay:.1s">
  <rect x="64" y="58" width="236" height="34" rx="17" fill="#2CB67D" fill-opacity="0.1" stroke="#2CB67D" stroke-opacity="0.4"/>
  <circle class="pulse" cx="84" cy="75" r="5" fill="#2CB67D"/>
  <text x="98" y="80" font-size="14" font-weight="600" fill="#86EFAC">Hey there, I’m 👋 · open to collab</text>
</g>
<text class="fade" style="animation-delay:.25s" x="62" y="168" font-size="76" font-weight="800" fill="#F8FAFC" letter-spacing="-1.5">Amit Katare</text>
<text class="fade" style="animation-delay:.45s" x="64" y="218" font-size="34" font-weight="700" fill="url(#brand)">Software Development Engineer</text>
<text class="fade" style="animation-delay:.65s" x="64" y="256" font-size="20" fill="#94A3B8">@ <tspan fill="#F1F5F9" font-weight="700">eSampark Tech Solutions Pvt Ltd</tspan></text>
<g class="fade" style="animation-delay:0.90s"><rect x="64" y="282" width="180" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/><text x="154" y="304" text-anchor="middle" font-size="14" fill="#CBD5E1">📍 Gurugram, Haryana</text></g><g class="fade" style="animation-delay:1.02s"><rect x="254" y="282" width="83" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/><text x="295" y="304" text-anchor="middle" font-size="14" fill="#CBD5E1">🎓 Medh</text></g><g class="fade" style="animation-delay:1.14s"><rect x="346" y="282" width="115" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/><text x="404" y="304" text-anchor="middle" font-size="14" fill="#CBD5E1">🎧 eSampark</text></g><g class="fade" style="animation-delay:1.26s"><rect x="472" y="282" width="157" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/><text x="550" y="304" text-anchor="middle" font-size="14" fill="#CBD5E1">⚡ MERN + Next.js</text></g>
<g class="fade" style="animation-delay:1.40s"><text x="64" y="376" font-size="30" font-weight="800" fill="url(#brand)">1,000+</text><text x="64" y="400" font-size="13" fill="#94A3B8">commits shipped</text></g><g class="fade" style="animation-delay:1.55s"><text x="264" y="376" font-size="30" font-weight="800" fill="url(#brand)">2</text><text x="264" y="400" font-size="13" fill="#94A3B8">products in production</text></g><g class="fade" style="animation-delay:1.70s"><text x="464" y="376" font-size="30" font-weight="800" fill="url(#brand)">Aug ’25</text><text x="464" y="400" font-size="13" fill="#94A3B8">joined eSampark</text></g>

<g class="fade" style="animation-delay:.3s">
  <rect x="720" y="56" width="420" height="340" rx="16" fill="#0D1117" fill-opacity="0.92" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <path d="M736 56h388a16 16 0 0 1 16 16v20H720V72a16 16 0 0 1 16-16z" fill="#FFFFFF" fill-opacity="0.04"/>
  <circle cx="744" cy="74" r="6" fill="#FF5F57"/><circle cx="764" cy="74" r="6" fill="#FEBC2E"/><circle cx="784" cy="74" r="6" fill="#28C840"/>
