<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Code it. Ship it. Make it move.">
<defs>
  <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7F5AF0" stop-opacity="0.7"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.06"/><stop offset="1" stop-color="#2CB67D" stop-opacity="0.6"/></linearGradient>
  <linearGradient id="brand" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="reflect">
    <stop offset="0" stop-color="#A78BFA"/><stop offset="0.5" stop-color="#2CB67D"/><stop offset="1" stop-color="#38BDF8"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="0 0;600 0;0 0" dur="8s" repeatCount="indefinite"/>
  </linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
  <clipPath id="clip"><rect width="1200" height="220" rx="24"/></clipPath>
</defs>
<style>
  .fade{animation:fade .7s ease-out both}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .pulse{animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
</style>
<g clip-path="url(#clip)"><rect width="1200" height="220" fill="#0B0F19"/><circle cx="200" cy="220" r="160" fill="#7F5AF0" opacity="0.3" filter="url(#blur)"/><circle cx="1000" cy="0" r="160" fill="#0EA5E9" opacity="0.25" filter="url(#blur)"/><circle cx="600" cy="240" r="120" fill="#2CB67D" opacity="0.18" filter="url(#blur)"/></g>
<rect x="0.75" y="0.75" width="1198.5" height="218.5" rx="24" fill="none" stroke="url(#stroke)" stroke-width="1.5"/>
<g class="fade">
  <text x="600.0" y="92" text-anchor="middle" font-size="40" font-weight="800" fill="url(#brand)">Code it. Ship it. Make it move.</text>
  <text x="600.0" y="132" text-anchor="middle" font-size="16" fill="#94A3B8">Thanks for stopping by — always happy to talk products, code and collaborations.</text>
  <text x="600.0" y="176" text-anchor="middle" font-size="13" font-weight="600" letter-spacing="2" fill="#64748B">AMIT KATARE  ·  SDE @ ESAMPARK  ·  GURUGRAM, INDIA</text>
</g>
</svg>
