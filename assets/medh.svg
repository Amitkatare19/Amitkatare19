<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Medh — Global EdTech Platform">
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A78BFA"/><stop offset="1" stop-color="#7F5AF0"/></linearGradient>
  <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A78BFA" stop-opacity="0.9"/><stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0.06"/><stop offset="1" stop-color="#7F5AF0" stop-opacity="0.6"/></linearGradient>
  <linearGradient id="bar" x1="0" y1="0" x2="300" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="reflect">
    <stop offset="0" stop-color="#A78BFA"/><stop offset="1" stop-color="#7F5AF0"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="0 0;300 0;0 0" dur="6s" repeatCount="indefinite"/>
  </linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
  <clipPath id="clip"><rect width="600" height="500" rx="24"/></clipPath>
</defs>
<style>
  .fade{animation:fade .7s ease-out both}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .orb{animation:orb 10s ease-in-out infinite}
  @keyframes orb{0%,100%{transform:translate(0,0)}50%{transform:translate(-60px,30px)}}
</style>
<g clip-path="url(#clip)">
  <rect width="600" height="500" fill="#0B0F19"/>
  <circle class="orb" cx="540" cy="40" r="130" fill="#A78BFA" opacity="0.32" filter="url(#blur)"/>
  <rect width="600" height="4" fill="url(#bar)"/>
</g>
<rect x="0.75" y="0.75" width="598.5" height="498.5" rx="24" fill="none" stroke="url(#stroke)" stroke-width="1.5"/>

<g class="fade" style="animation-delay:.05s">
  <rect x="32" y="32" width="58" height="58" rx="16" fill="url(#g)"/>
  <text x="61" y="71" text-anchor="middle" font-size="28">🎓</text>
  <text x="106" y="62" font-size="28" font-weight="800" fill="#F8FAFC">Medh</text>
  <text x="106" y="86" font-size="15" font-weight="600" fill="#A78BFA">Global EdTech Platform</text>
  <rect x="473" y="40" width="95" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.14"/>
  <text x="520" y="59" text-anchor="middle" font-size="13" font-weight="600" fill="#E2E8F0">medh.co ↗</text>
</g>
<g class="fade" style="animation-delay:.2s">
  <text x="32" y="132" font-size="15" fill="#CBD5E1">Skill courses for every stage of life — live classes,</text>
  <text x="32" y="155" font-size="15" fill="#CBD5E1">mentorship, payments and HR, all in one platform.</text>
</g>
<g class="fade" style="animation-delay:0.35s"><rect x="32" y="184" width="260" height="96" rx="16" fill="#FFFFFF" fill-opacity="0.035" stroke="#FFFFFF" stroke-opacity="0.08"/><rect x="32" y="206" width="3" height="52" rx="1.5" fill="#A78BFA"/><text x="52" y="224" font-size="20">🗓️</text><text x="84" y="223" font-size="16" font-weight="700" fill="#F1F5F9">Live classes</text><text x="52" y="254" font-size="13" fill="#94A3B8">Batches · demos · Zoom &amp; BBB</text></g><g class="fade" style="animation-delay:0.47s"><rect x="308" y="184" width="260" height="96" rx="16" fill="#FFFFFF" fill-opacity="0.035" stroke="#FFFFFF" stroke-opacity="0.08"/><rect x="308" y="206" width="3" height="52" rx="1.5" fill="#A78BFA"/><text x="328" y="224" font-size="20">💳</text><text x="360" y="223" font-size="16" font-weight="700" fill="#F1F5F9">Payments</text><text x="328" y="254" font-size="13" fill="#94A3B8">Razorpay · EMI · receipts</text></g><g class="fade" style="animation-delay:0.59s"><rect x="32" y="296" width="260" height="96" rx="16" fill="#FFFFFF" fill-opacity="0.035" stroke="#FFFFFF" stroke-opacity="0.08"/><rect x="32" y="318" width="3" height="52" rx="1.5" fill="#A78BFA"/><text x="52" y="336" font-size="20">👥</text><text x="84" y="335" font-size="16" font-weight="700" fill="#F1F5F9">HRMS &amp; payroll</text><text x="52" y="366" font-size="13" fill="#94A3B8">Attendance · leave · PDFs</text></g><g class="fade" style="animation-delay:0.71s"><rect x="308" y="296" width="260" height="96" rx="16" fill="#FFFFFF" fill-opacity="0.035" stroke="#FFFFFF" stroke-opacity="0.08"/><rect x="308" y="318" width="3" height="52" rx="1.5" fill="#A78BFA"/><text x="328" y="336" font-size="20">📞</text><text x="360" y="335" font-size="16" font-weight="700" fill="#F1F5F9">Real-time dialer</text><text x="328" y="366" font-size="13" fill="#94A3B8">WebRTC · Socket.IO · live calls</text></g>
<g class="fade" style="animation-delay:0.90s"><rect x="32" y="420" width="67" height="26" rx="13" fill="#A78BFA" fill-opacity="0.12" stroke="#A78BFA" stroke-opacity="0.35"/><text x="66" y="437" text-anchor="middle" font-size="12" font-weight="600" fill="#E2E8F0">Next.js</text></g><g class="fade" style="animation-delay:0.96s"><rect x="107" y="420" width="57" height="26" rx="13" fill="#A78BFA" fill-opacity="0.12" stroke="#A78BFA" stroke-opacity="0.35"/><text x="135" y="437" text-anchor="middle" font-size="12" font-weight="600" fill="#E2E8F0">React</text></g><g class="fade" style="animation-delay:1.02s"><rect x="172" y="420" width="67" height="26" rx="13" fill="#A78BFA" fill-opacity="0.12" stroke="#A78BFA" stroke-opacity="0.35"/><text x="205" y="437" text-anchor="middle" font-size="12" font-weight="600" fill="#E2E8F0">Node.js</text></g><g class="fade" style="animation-delay:1.08s"><rect x="247" y="420" width="73" height="26" rx="13" fill="#A78BFA" fill-opacity="0.12" stroke="#A78BFA" stroke-opacity="0.35"/><text x="283" y="437" text-anchor="middle" font-size="12" font-weight="600" fill="#E2E8F0">MongoDB</text></g><g class="fade" style="animation-delay:1.14s"><rect x="327" y="420" width="54" height="26" rx="13" fill="#A78BFA" fill-opacity="0.12" stroke="#A78BFA" stroke-opacity="0.35"/><text x="354" y="437" text-anchor="middle" font-size="12" font-weight="600" fill="#E2E8F0">Redis</text></g><g class="fade" style="animation-delay:1.20s"><rect x="389" y="420" width="83" height="26" rx="13" fill="#A78BFA" fill-opacity="0.12" stroke="#A78BFA" stroke-opacity="0.35"/><text x="431" y="437" text-anchor="middle" font-size="12" font-weight="600" fill="#E2E8F0">Socket.IO</text></g><g class="fade" style="animation-delay:1.26s"><rect x="481" y="420" width="46" height="26" rx="13" fill="#A78BFA" fill-opacity="0.12" stroke="#A78BFA" stroke-opacity="0.35"/><text x="504" y="437" text-anchor="middle" font-size="12" font-weight="600" fill="#E2E8F0">AWS</text></g>
<text class="fade" style="animation-delay:1.3s" x="32" y="478" font-size="13" font-weight="600" fill="#64748B">⚡ 1,000+ commits across web + backend</text>
</svg>
